name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Dispatched at the tag ref by prepare-release.yml (a tag pushed with
  # GITHUB_TOKEN can't trigger the push event above).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-tests:
    name: Linux tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: linux-test-swiftpm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            linux-test-swiftpm-

      - name: Test
        run: swift test

  macos-tests:
    name: macOS tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The runner's default Xcode Swift is older than the tools-version PlumeKit's
      # manifest declares (6.2), so install a matching toolchain from swift.org. It's
      # put on PATH only in the Swift steps below (not globally) so it doesn't shadow
      # Xcode's clang when SwiftPM builds the bundled C image libraries.
      - name: Install Swift 6.3.2
        run: |
          curl -fsSL https://download.swift.org/swift-6.3.2-release/xcode/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE-osx.pkg -o /tmp/swift.pkg
          sudo installer -pkg /tmp/swift.pkg -target /

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: macos-test-swiftpm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            macos-test-swiftpm-

      - name: Test
        run: |
          export PATH="/Library/Developer/Toolchains/swift-6.3.2-RELEASE.xctoolchain/usr/bin:$PATH"
          swift test

  launcher:
    name: Launcher script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Smoke test launcher
        run: |
          test -x support/inkstead-writer
          if support/inkstead-writer build 2>launcher-error.txt; then
            echo "Launcher unexpectedly succeeded outside an Inkstead Writer site."
            exit 1
          fi
          grep -q "not inside an Inkstead Writer site" launcher-error.txt
          test -x support/install.sh
          sh -n support/install.sh
          support/install.sh --help >/dev/null

      - name: Package launcher assets
        run: |
          mkdir -p artifact
          cp support/inkstead-writer "artifact/inkstead-writer-${GITHUB_REF_NAME}"
          chmod +x "artifact/inkstead-writer-${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: launcher-script
          path: artifact/*

  linux:
    name: Linux binary (${{ matrix.arch }})
    needs:
      - linux-tests
      - macos-tests
    runs-on: ${{ matrix.runner }}
    container:
      image: swift:6.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check tag matches Inkstead Writer version
        run: |
          VERSION="$(sed -n 's/.*currentVersion = "\(.*\)".*/\1/p' Sources/InksteadWriter/Config/InksteadWriterConfig.swift)"
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Inkstead Writer version $VERSION"
            exit 1
          fi

      - name: Build
        run: swift build -c release --static-swift-stdlib

      - name: Package
        run: |
          mkdir -p artifact
          cp .build/release/inkstead-writer artifact/inkstead-writer
          cp LICENSE.txt artifact/LICENSE.txt
          tar -C artifact -czf inkstead-writer-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz inkstead-writer LICENSE.txt

      - name: Smoke test archive
        run: |
          mkdir -p smoke
          tar -xzf inkstead-writer-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz -C smoke
          test -x smoke/inkstead-writer
          test -f smoke/LICENSE.txt
          smoke/inkstead-writer version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-binary
          path: inkstead-writer-*-linux-${{ matrix.arch }}.tar.gz

  macos:
    name: macOS binary (${{ matrix.arch }})
    needs:
      - linux-tests
      - macos-tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check tag matches Inkstead Writer version
        run: |
          VERSION="$(sed -n 's/.*currentVersion = "\(.*\)".*/\1/p' Sources/InksteadWriter/Config/InksteadWriterConfig.swift)"
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Inkstead Writer version $VERSION"
            exit 1
          fi

      # The runner's default Xcode Swift is older than the tools-version PlumeKit's
      # manifest declares (6.2), so install a matching toolchain from swift.org. It's
      # put on PATH only in the build step below (not globally) so it doesn't shadow
      # Xcode's clang when SwiftPM builds the bundled C image libraries.
      - name: Install Swift 6.3.2
        run: |
          curl -fsSL https://download.swift.org/swift-6.3.2-release/xcode/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE-osx.pkg -o /tmp/swift.pkg
          sudo installer -pkg /tmp/swift.pkg -target /

      - name: Build
        run: |
          export PATH="/Library/Developer/Toolchains/swift-6.3.2-RELEASE.xctoolchain/usr/bin:$PATH"
          swift build -c release

      - name: Package
        run: |
          mkdir -p artifact
          cp .build/release/inkstead-writer artifact/inkstead-writer
          cp LICENSE.txt artifact/LICENSE.txt
          tar -C artifact -czf inkstead-writer-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.tar.gz inkstead-writer LICENSE.txt

      - name: Smoke test archive
        run: |
          mkdir -p smoke
          tar -xzf inkstead-writer-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.tar.gz -C smoke
          test -x smoke/inkstead-writer
          test -f smoke/LICENSE.txt
          smoke/inkstead-writer version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-binary
          path: inkstead-writer-*-macos-${{ matrix.arch }}.tar.gz

  release:
    name: Publish GitHub release
    needs:
      - launcher
      - linux
      - macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum "inkstead-writer-${GITHUB_REF_NAME}" *.tar.gz > "inkstead-writer-${GITHUB_REF_NAME}-SHA256SUMS"
          sha256sum -c "inkstead-writer-${GITHUB_REF_NAME}-SHA256SUMS"

      # The release description is the version's upgrade-notes page (with doc
      # links rewritten to inkstead.app), followed by GitHub's generated
      # changelog. Every release has a page (an additive one rolls into an
      # automatic all-clear); the --generate-notes fallback only covers a tag
      # cut outside the prepare-release workflow.
      - name: Compose release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PAGE="docs/upgrading/${VERSION}.md"
          if [ -f "$PAGE" ]; then
            {
              echo "Upgrade guide: https://inkstead.app/writer/upgrading/${VERSION}/"
              echo
              # Doc links are site-absolute (the convention in docs/), so
              # prefix them with the site origin and the /writer/ section.
              awk 'NR==1 && /^# /{next} {print}' "$PAGE" \
                | sed -E 's|\]\((/[A-Za-z0-9._/#-]*)\)|](https://inkstead.app/writer\1)|g'
              echo
              echo "---"
              echo
              gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body
            } > release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release
        run: |
          if [ -f release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "artifacts/inkstead-writer-${GITHUB_REF_NAME}" artifacts/*.tar.gz artifacts/*-SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "artifacts/inkstead-writer-${GITHUB_REF_NAME}" artifacts/*.tar.gz artifacts/*-SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
