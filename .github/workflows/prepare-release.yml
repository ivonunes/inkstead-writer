name: Prepare release

# The one-step release: run this workflow with a version (Actions → Prepare
# release → Run workflow, or `gh workflow run prepare-release.yml -f
# version=X.Y.Z`). It tests `main`, applies every release edit
# (support/prepare-release.sh: the version constant, the upgrade-notes roll),
# commits, creates the tag, pushes both, and dispatches the Release workflow at
# the new tag to build and publish the artifacts.
#
# The tag is created ON the release commit, so it is immutable and correct from
# birth — release.yml refuses a tag that doesn't match currentVersion.
# inkstead.app needs nothing per release: its build discovers upgrade-notes pages.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (MAJOR.MINOR.PATCH, no leading v)"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Test, bump, tag
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate version
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          if git ls-remote --tags origin "refs/tags/v${{ inputs.version }}" | grep -q .; then
            echo "Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: linux-test-swiftpm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            linux-test-swiftpm-

      # The tag must never point at a broken tree; test.yml only runs on PRs.
      - name: Test
        run: swift test

      - name: Apply release edits
        run: support/prepare-release.sh "${{ inputs.version }}"

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "Inkstead Writer ${{ inputs.version }}"
          git push origin main "v${{ inputs.version }}"

      # A tag pushed with GITHUB_TOKEN doesn't fire tag-triggered workflows
      # (GitHub's recursion guard), so start the Release build explicitly at
      # the new tag — its jobs see the tag as their ref, exactly as if the
      # push had triggered them.
      - name: Dispatch the Release workflow
        run: gh workflow run release.yml --ref "v${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
