name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: linux-test-swiftpm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            linux-test-swiftpm-

      - name: Test
        run: swift test

      - name: Release build
        run: swift build -c release --static-swift-stdlib

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: macos-test-swiftpm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            macos-test-swiftpm-

      - name: Test
        run: swift test

      - name: Release build
        run: swift build -c release
