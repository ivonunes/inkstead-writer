name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test
        run: swift test

      - name: Release build
        run: swift build -c release --static-swift-stdlib

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test
        run: swift test

      - name: Release build
        run: swift build -c release
